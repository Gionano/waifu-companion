<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waifu VRM Starter</title>
    <style>
      :root {
        --pip-width: 35vw;
        --pip-top: 16px;
        --pip-right: 16px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
      #app { width: 100vw; height: 100vh; display: block; position: relative; z-index: 2; }
      #webcam { display: none; }

      #debug-panel {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px;
        background: rgba(20, 20, 35, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8e8f0;
        backdrop-filter: blur(6px);
        z-index: 10;
        max-width: 220px;
      }
      #debug-panel h3 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        opacity: 0.85;
        margin-bottom: 2px;
      }
      #debug-panel button {
        padding: 8px 12px;
        font-size: 13px;
        color: #fff;
        background: #3a3a5c;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      #debug-panel button:hover { background: #4d4d7a; }
      #debug-panel button:active { background: #5f5f96; }

      #status {
        position: fixed;
        bottom: 16px;
        left: 16px;
        padding: 8px 14px;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: #a8a8c0;
        background: rgba(20, 20, 35, 0.7);
        border-radius: 6px;
        z-index: 10;
      }

      #companion-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 300px;
        max-height: calc(100vh - 32px);
        padding: 14px;
        background: rgba(20, 20, 35, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8e8f0;
        backdrop-filter: blur(6px);
        z-index: 10;
      }
      #companion-panel h3 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        opacity: 0.85;
      }
      #chat-log {
        flex: 1;
        min-height: 180px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        font-size: 13px;
        line-height: 1.4;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 6px;
      }
      .log-line { word-wrap: break-word; }
      .log-line.user { color: #cfe3ff; }
      .log-line.assistant { color: #ffd9ec; }
      .log-line.vision { color: #c8f0d0; }
      .log-line.muted { color: #8a8aa0; font-style: italic; }
      .log-line.error { color: #ff9b9b; }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #mic-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: #a8a8c0;
      }
      #mic-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #6a6a80;
        transition: background 0.2s ease;
      }
      #mic-status.live #mic-dot { background: #3ad07a; box-shadow: 0 0 6px #3ad07a; }

      @media (max-width: 768px) {
        #webcam {
          display: block;
          position: fixed;
          top: 0; left: 0;
          width: 100vw; height: 100vh;
          object-fit: cover;
          z-index: 0;
        }
        #app {
          position: fixed;
          top: var(--pip-top);
          right: var(--pip-right);
          width: var(--pip-width);
          height: calc(var(--pip-width) * 1.35);
          border-radius: 12px;
          box-shadow: 0 6px 16px rgba(0,0,0,0.5);
          border: 1px solid rgba(255, 255, 255, 0.1);
          z-index: 2;
          background: transparent;
        }
        #companion-panel {
          top: auto;
          bottom: 16px;
          right: 16px;
          left: 16px;
          width: auto;
          max-height: 35vh;
        }
        #debug-panel {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="debug-panel">
      <h3>Ekspresi (Debug)</h3>
      <button data-expression="happy">Happy</button>
      <button data-expression="sad">Sad</button>
      <button data-expression="surprised">Surprised</button>
      <button data-expression="blink">Blink</button>
      <button data-expression="neutral">Reset / Neutral</button>
    </div>

    <div id="companion-panel">
      <div class="panel-head">
        <h3>Amika</h3>
        <span id="mic-status">
          <span id="mic-dot"></span>
          <span id="mic-label">Diam</span>
        </span>
      </div>
      <div id="chat-log"></div>
    </div>

    <video id="webcam" playsinline muted></video>
    <canvas id="capture-canvas" style="display: none"></canvas>

    <div id="status">Memuat model…</div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/companion.js"></script>
  </body>
</html>
